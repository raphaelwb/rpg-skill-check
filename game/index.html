
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPG Skill Check</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--tg-theme-text-color, #222);
      background: var(--tg-theme-bg-color, #fff);
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 { font-size: 25px; margin: 12px 0; }
    p { color: var(--tg-theme-hint-color, #777); }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: var(--tg-theme-button-text-color, white);
      background: var(--tg-theme-button-color, #2481cc);
    }

    button:disabled { opacity: .4; cursor: default; }

    .primary {
      width: 100%;
      margin-top: 14px;
    }

    .secondary {
      width: 100%;
      margin-top: 12px;
      background: var(--tg-theme-secondary-bg-color, #ddd);
      color: var(--tg-theme-text-color, #222);
    }

    .hidden { display: none !important; }

    .number {
      font-size: 76px;
      font-weight: bold;
      margin: 35px 0;
    }

    .sequence {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 28px 0;
      min-height: 55px;
    }

    .symbol {
      font-size: 27px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--tg-theme-secondary-bg-color, #eee);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      gap: 9px;
      justify-content: center;
      margin: 25px auto;
    }

    .controls button {
      width: 70px;
      height: 62px;
      padding: 0;
      font-size: 27px;
    }

    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; grid-row: 2; }
    .controls .down { grid-column: 2; grid-row: 2; }
    .controls .right { grid-column: 3; grid-row: 2; }

    .status { font-size: 18px; margin-top: 18px; }
    .timer { font-size: 24px; font-weight: bold; }
    .muted { color: var(--tg-theme-hint-color, #777); }
    .result-icon { font-size: 48px; margin-top: 25px; }
  </style>
</head>

<body>
<main>
  <h1>RPG Skill Check</h1>

  <!-- MENU DE DEMONSTRAÇÃO -->
  <section id="menu-screen" class="hidden">
    <p>Modo de demonstração</p>
    <p>Escolha um teste para experimentar.</p>
    <button id="demo-number" class="primary">Teste básico</button>
    <button id="demo-sequence" class="secondary">Teste de sequência</button>
  </section>

  <!-- TESTE NUMÉRICO -->
  <section id="number-screen" class="hidden">
    <p>Teste básico</p>
    <div id="number-value" class="number">?</div>
    <p id="number-range"></p>
    <button id="roll-button" class="primary">Rolar</button>
  </section>

  <!-- TESTE DE SEQUÊNCIA -->
  <section id="sequence-screen" class="hidden">
    <p>Reproduza a sequência na ordem apresentada.</p>

    <div id="sequence-display" class="sequence"></div>

    <div id="sequence-play">
      <div id="timer" class="timer"></div>
      <div id="progress" class="status"></div>

      <div class="controls">
        <button class="up" data-symbol="UP">↑</button>
        <button class="left" data-symbol="LEFT">←</button>
        <button class="down" data-symbol="DOWN">↓</button>
        <button class="right" data-symbol="RIGHT">→</button>
      </div>
    </div>

    <p class="muted">Você também pode usar as setas do teclado.</p>
  </section>

  <!-- RESULTADO -->
  <section id="result-screen" class="hidden">
    <div id="result-icon" class="result-icon"></div>
    <h1 id="result-title"></h1>
    <p id="result-message"></p>
    <p id="result-countdown" class="muted"></p>
  </section>

  <p id="error-message" class="status"></p>
</main>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(location.search);
  const requestedMethod = params.get("method");

  // Sem método na URL, a página está em modo de demonstração.
  const demoMode = !requestedMethod;

  const $ = id => document.getElementById(id);

  const screens = [
    "menu-screen",
    "number-screen",
    "sequence-screen",
    "result-screen"
  ];

  function showScreen(id) {
    screens.forEach(screen => $(screen).classList.add("hidden"));
    $(id).classList.remove("hidden");
    $("error-message").textContent = "";
  }

  function randomInt(min, max) {
    const range = max - min + 1;
    const array = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / range) * range;

    let value;
    do {
      crypto.getRandomValues(array);
      value = array[0];
    } while (value >= limit);

    return min + (value % range);
  }

  function randomSequence(length) {
    const symbols = ["UP", "DOWN", "LEFT", "RIGHT"];
    return Array.from(
      { length },
      () => symbols[randomInt(0, symbols.length - 1)]
    );
  }

  function showResult(title, message, payload, success) {
    showScreen("result-screen");

    $("result-icon").textContent = success ? "✅" : "❌";
    $("result-title").textContent = title;
    $("result-message").textContent = message;

    let remaining = 2;
    $("result-countdown").textContent =
      `Retornando em ${remaining} segundo(s)...`;

    // O Mini App só envia os dados depois que o jogador vê o resultado.
    const countdown = setInterval(() => {
      remaining--;

      if (remaining > 0) {
        $("result-countdown").textContent =
          `Retornando em ${remaining} segundo(s)...`;
      } else {
        clearInterval(countdown);
        $("result-countdown").textContent =
          demoMode ? "Demonstração concluída." : "Enviando resultado...";

        if (!demoMode && tg) {
          tg.sendData(JSON.stringify(payload));
        }
      }
    }, 1000);
  }

  // TESTE BÁSICO
  function startNumber(min, max) {
    if (
      !Number.isSafeInteger(min) ||
      !Number.isSafeInteger(max) ||
      min > max ||
      max - min >= 0x100000000
    ) {
      $("error-message").textContent = "Intervalo numérico inválido.";
      return;
    }

    showScreen("number-screen");

    $("number-value").textContent = "?";
    $("number-range").textContent = `Intervalo: ${min} até ${max}`;
    $("roll-button").disabled = false;

    $("roll-button").onclick = () => {
      const result = randomInt(min, max);
      $("number-value").textContent = result;
      $("roll-button").disabled = true;

      showResult(
        "Rolagem concluída",
        `Resultado: ${result}`,
        {
          type: "skill_check",
          method: "number",
          minimum: min,
          maximum: max,
          result
        },
        true
      );
    };
  }

  // TESTE DE SEQUÊNCIA
  function startSequence(sequence, challengeId, timeLimit) {
    const validSymbols = ["UP", "DOWN", "LEFT", "RIGHT"];

    if (
      !Array.isArray(sequence) ||
      sequence.length === 0 ||
      !sequence.every(symbol => validSymbols.includes(symbol)) ||
      !Number.isSafeInteger(timeLimit) ||
      timeLimit <= 0 ||
      timeLimit > 3600000
    ) {
      $("error-message").textContent =
        "Configuração da sequência inválida.";
      return;
    }

    showScreen("sequence-screen");

    const arrows = {
      UP: "↑",
      DOWN: "↓",
      LEFT: "←",
      RIGHT: "→"
    };

    // A sequência permanece visível durante todo o desafio.
    $("sequence-display").innerHTML = "";

    sequence.forEach(symbol => {
      const item = document.createElement("div");
      item.className = "symbol";
      item.textContent = arrows[symbol];
      $("sequence-display").appendChild(item);
    });

    let inputs = [];
    let startedAt = performance.now();
    let finished = false;
    let timeoutId;

    const buttons = document.querySelectorAll("[data-symbol]");

    function elapsed() {
      return Math.max(0, Math.round(performance.now() - startedAt));
    }

    function updateProgress() {
      $("progress").textContent =
        `${inputs.length} de ${sequence.length} direções`;
    }

    function finish(success, reason) {
      if (finished) return;
      finished = true;

      clearTimeout(timeoutId);
      buttons.forEach(button => button.disabled = true);

      const timeMs = Math.min(elapsed(), timeLimit);

      showResult(
        success ? "Desafio concluído!" : "Desafio encerrado",
        `${reason}\nDireções corretas: ${success ? sequence.length : inputs.filter((v, i) => v === sequence[i]).length}/${sequence.length}\nTempo: ${timeMs} ms`,
        {
          type: "skill_check",
          method: "sequence",
          challenge_id: challengeId,
          inputs,
          time_ms: timeMs
        },
        success
      );
    }

    function inputSymbol(symbol) {
      if (finished) return;

      inputs.push(symbol);
      updateProgress();

      const index = inputs.length - 1;

      if (inputs[index] !== sequence[index]) {
        finish(false, "Você errou uma direção.");
        return;
      }

      if (inputs.length === sequence.length) {
        finish(true, "Você reproduziu toda a sequência corretamente.");
      }
    }

    buttons.forEach(button => {
      button.disabled = false;
      button.onclick = () => inputSymbol(button.dataset.symbol);
    });

    // Evita que listeners de desafios anteriores continuem ativos.
    if (window.sequenceKeyHandler) {
      document.removeEventListener("keydown", window.sequenceKeyHandler);
    }

    window.sequenceKeyHandler = event => {
      const keys = {
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT"
      };

      if (keys[event.key]) {
        event.preventDefault();
        inputSymbol(keys[event.key]);
      }
    };

    document.addEventListener("keydown", window.sequenceKeyHandler);

    updateProgress();

    timeoutId = setTimeout(() => {
      finish(false, "O tempo acabou.");
    }, timeLimit);

    const timer = $("timer");
    timer.textContent = `${(timeLimit / 1000).toFixed(1)}s`;

    const timerInterval = setInterval(() => {
      if (finished) {
        clearInterval(timerInterval);
        return;
      }

      const remaining = Math.max(0, timeLimit - elapsed());
      timer.textContent = `${(remaining / 1000).toFixed(1)}s`;
    }, 50);
  }

  // DEMONSTRAÇÃO NO NAVEGADOR
  function startDemo() {
    showScreen("menu-screen");

    $("demo-number").onclick = () => {
      startNumber(1, 100);
    };

    $("demo-sequence").onclick = () => {
      startSequence(randomSequence(5), null, 15000);
    };
  }

  // INICIALIZAÇÃO
  if (demoMode) {
    startDemo();
  } else if (requestedMethod === "number") {
    const min = Number(params.get("minimum") ?? 1);
    const max = Number(params.get("maximum") ?? 100);
    startNumber(min, max);
  } else if (requestedMethod === "sequence") {
    const sequence = (params.get("sequence") || "")
      .split(",")
      .filter(Boolean);

    startSequence(
      sequence,
      params.get("challenge_id"),
      Number(params.get("time_limit") || 15000)
    );
  } else {
    $("error-message").textContent = "Método de avaliação desconhecido.";
  }
})();
</script>
</body>
</html>
