
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Roll</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
        }

        .container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: var(--tg-theme-hint-color, #aaaaaa);
            margin-bottom: 30px;
        }

        .range {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #aaaaaa);
        }

        .result {
            font-size: 76px;
            font-weight: bold;
            margin: 25px 0;
        }

        button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .status {
            min-height: 24px;
            margin-top: 20px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #aaaaaa);
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Skill Roll</h1>

        <p class="description">
            Faça sua rolagem de habilidade.
        </p>

        <div class="range" id="range"></div>

        <div class="result" id="result">?</div>

        <button id="rollButton">
            Rolar habilidade
        </button>

        <div class="status" id="status"></div>
    </main>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const params = new URLSearchParams(window.location.search);

        const min = Number(params.get("min") ?? 1);
        const max = Number(params.get("max") ?? 100);

        const resultElement = document.getElementById("result");
        const rangeElement = document.getElementById("range");
        const statusElement = document.getElementById("status");
        const rollButton = document.getElementById("rollButton");

        const validRange =
            Number.isSafeInteger(min) &&
            Number.isSafeInteger(max) &&
            min <= max &&
            max - min <= 1000000;

        rangeElement.textContent = validRange
            ? `Faixa de rolagem: ${min} até ${max}`
            : "Faixa de rolagem inválida";

        rollButton.disabled = !validRange;

        function randomInteger(min, max) {
            const range = max - min + 1;

            if (range === 1) return min;

            if (window.crypto?.getRandomValues) {
                const limit = Math.floor(4294967296 / range) * range;
                const array = new Uint32Array(1);
                let value;

                do {
                    window.crypto.getRandomValues(array);
                    value = array[0];
                } while (value >= limit);

                return min + (value % range);
            }

            return min + Math.floor(Math.random() * range);
        }

        rollButton.addEventListener("click", () => {
            if (!validRange || rollButton.disabled) return;

            const result = randomInteger(min, max);

            resultElement.textContent = result;
            rollButton.disabled = true;
            statusElement.textContent = "Enviando resultado...";

            if (tg && typeof tg.sendData === "function") {
                tg.sendData(JSON.stringify({
                    type: "skill_roll",
                    result: result,
                    min: min,
                    max: max
                }));
            } else {
                statusElement.textContent =
                    "Modo de teste: resultado gerado localmente.";
                rollButton.disabled = false;
            }
        });
    </script>
</body>
</html>
