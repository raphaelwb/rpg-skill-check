
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Skill Check</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--tg-theme-text-color, #222);
      background: var(--tg-theme-bg-color, #fff);
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 { font-size: 25px; margin: 12px 0; }
    p { color: var(--tg-theme-hint-color, #777); }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: var(--tg-theme-button-text-color, white);
      background: var(--tg-theme-button-color, #2481cc);
    }

    button:disabled { opacity: .4; cursor: default; }

    .primary { width: 100%; margin-top: 20px; }
    .hidden { display: none !important; }

    .number {
      font-size: 76px;
      font-weight: bold;
      margin: 35px 0;
    }

    .sequence {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 28px 0;
      min-height: 55px;
    }

    .symbol {
      font-size: 27px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--tg-theme-secondary-bg-color, #eee);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      gap: 9px;
      justify-content: center;
      margin: 25px auto;
    }

    .controls button {
      width: 70px;
      height: 62px;
      padding: 0;
      font-size: 27px;
    }

    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; grid-row: 2; }
    .controls .down { grid-column: 2; grid-row: 2; }
    .controls .right { grid-column: 3; grid-row: 2; }

    .status { font-size: 18px; margin-top: 18px; }
    .timer { font-size: 24px; font-weight: bold; }
    .muted { color: var(--tg-theme-hint-color, #777); }
  </style>
</head>
<body>
<main>
  <h1>RPG Skill Check</h1>

  <section id="number-screen" class="hidden">
    <p>Teste básico</p>
    <div id="number-value" class="number">?</div>
    <p id="number-range"></p>
    <button id="roll-button" class="primary">Rolar</button>
  </section>

  <section id="sequence-screen" class="hidden">
    <p>Memorize a sequência</p>
    <div id="sequence-display" class="sequence"></div>
    <p id="sequence-instruction" class="muted"></p>

    <div id="sequence-play" class="hidden">
      <div id="timer" class="timer"></div>
      <div id="progress" class="status"></div>

      <div class="controls">
        <button class="up" data-symbol="UP">↑</button>
        <button class="left" data-symbol="LEFT">←</button>
        <button class="down" data-symbol="DOWN">↓</button>
        <button class="right" data-symbol="RIGHT">→</button>
      </div>
    </div>
  </section>

  <section id="result-screen" class="hidden">
    <h1 id="result-title"></h1>
    <p id="result-message"></p>
  </section>

  <p id="error-message" class="status"></p>
</main>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(location.search);
  const method = params.get("method") || "number";

  const $ = id => document.getElementById(id);
  const show = id => $(id).classList.remove("hidden");
  const hide = id => $(id).classList.add("hidden");

  function showResult(title, message, payload) {
    hide("number-screen");
    hide("sequence-screen");
    show("result-screen");
    $("result-title").textContent = title;
    $("result-message").textContent = message;

    if (tg) {
      tg.sendData(JSON.stringify(payload));
    }
  }

  function randomInt(min, max) {
    const range = max - min + 1;
    const array = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / range) * range;

    let value;
    do {
      crypto.getRandomValues(array);
      value = array[0];
    } while (value >= limit);

    return min + (value % range);
  }

  // MÉTODO 1: TESTE NUMÉRICO
  function startNumber() {
    const min = Number(params.get("minimum") ?? 1);
    const max = Number(params.get("maximum") ?? 100);

    if (!Number.isInteger(min) || !Number.isInteger(max) || min > max) {
      $("error-message").textContent = "Intervalo numérico inválido.";
      return;
    }

    show("number-screen");
    $("number-range").textContent = `Intervalo: ${min} até ${max}`;

    $("roll-button").addEventListener("click", () => {
      const result = randomInt(min, max);
      $("number-value").textContent = result;

      showResult("Rolagem concluída", `Resultado: ${result}`, {
        type: "skill_check",
        method: "number",
        minimum: min,
        maximum: max,
        result
      });
    }, { once: true });
  }

  // MÉTODO 2: SEQUÊNCIA DE DIREÇÕES
  function startSequence() {
    const sequence = (params.get("sequence") || "").split(",").filter(Boolean);
    const challengeId = params.get("challenge_id");
    const displayTime = Number(params.get("display_time") || 2000);
    const timeLimit = Number(params.get("time_limit") || 15000);

    const validSymbols = ["UP", "DOWN", "LEFT", "RIGHT"];

    if (
      !challengeId ||
      sequence.length === 0 ||
      !sequence.every(s => validSymbols.includes(s)) ||
      !Number.isFinite(displayTime) ||
      !Number.isFinite(timeLimit) ||
      displayTime < 0 ||
      timeLimit <= 0
    ) {
      $("error-message").textContent = "Configuração da sequência inválida.";
      return;
    }

    show("sequence-screen");

    const arrows = { UP: "↑", DOWN: "↓", LEFT: "←", RIGHT: "→" };
    $("sequence-display").innerHTML = "";

    sequence.forEach(symbol => {
      const item = document.createElement("div");
      item.className = "symbol";
      item.textContent = arrows[symbol];
      $("sequence-display").appendChild(item);
    });

    let inputs = [];
    let startedAt = 0;
    let timeoutId;
    let timerId;
    let finished = false;

    function elapsed() {
      return Math.round(performance.now() - startedAt);
    }

    function finish(success, reason) {
      if (finished) return;
      finished = true;

      clearTimeout(timeoutId);
      clearInterval(timerId);

      const timeMs = startedAt ? elapsed() : 0;

      showResult(
        success ? "Sucesso!" : "Falha!",
        reason,
        {
          type: "skill_check",
          method: "sequence",
          challenge_id: challengeId,
          inputs,
          time_ms: timeMs
        }
      );
    }

    function updateProgress() {
      $("progress").textContent =
        `${inputs.length} de ${sequence.length} direções`;
    }

    function inputSymbol(symbol) {
      if (finished || !startedAt) return;

      inputs.push(symbol);
      updateProgress();

      const index = inputs.length - 1;

      if (inputs[index] !== sequence[index]) {
        finish(false, "Você errou uma direção.");
        return;
      }

      if (inputs.length === sequence.length) {
        finish(true, "Sequência reproduzida corretamente.");
      }
    }

    document.querySelectorAll("[data-symbol]").forEach(button => {
      button.addEventListener("click", () => {
        inputSymbol(button.dataset.symbol);
      });
    });

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT"
      };

      if (keys[event.key]) {
        event.preventDefault();
        inputSymbol(keys[event.key]);
      }
    });

    $("sequence-instruction").textContent =
      `Você terá ${displayTime / 1000} segundos para memorizar.`;

    setTimeout(() => {
      if (finished) return;

      $("sequence-display").innerHTML = "";
      $("sequence-instruction").textContent = "Reproduza a sequência!";
      show("sequence-play");

      startedAt = performance.now();
      updateProgress();

      timeoutId = setTimeout(() => {
        finish(false, "Tempo esgotado.");
      }, timeLimit);

      timerId = setInterval(() => {
        const remaining = Math.max(0, timeLimit - elapsed());
        $("timer").textContent = `${(remaining / 1000).toFixed(1)}s`;
      }, 50);
    }, displayTime);
  }

  if (method === "sequence") {
    startSequence();
  } else {
    startNumber();
  }
})();
</script>
</body>
</html>
