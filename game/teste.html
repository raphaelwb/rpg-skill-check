<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QTE - Skill Check Minimalista</title>
    <style>
        body {
            margin: 0;
            background-color: #0f1016;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(20, 21, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            width: 340px;
        }

        h2 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Barra de Tempo */
        .timer-bar-container {
            width: 100%;
            height: 6px;
            background: #27272a;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: #38bdf8;
            transform-origin: left;
            transition: transform linear;
        }

        /* Sequência de Símbolos Minimalistas */
        .sequence-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .symbol-item {
            width: 45px;
            height: 45px;
            background: #18181b;
            border: 2px solid #3f3f46;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #71717a;
            transition: all 0.2s ease;
        }

        /* Estados do Símbolo */
        .symbol-item.active {
            border-color: #38bdf8;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            transform: scale(1.05);
        }

        .symbol-item.success {
            border-color: #22c55e;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .symbol-item.error {
            border-color: #ef4444;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Botão de Início */
        button {
            background: #38bdf8;
            color: #0f1016;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #7dd3fc;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        #mensagem {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Teste de Perícia</h2>
        
        <div class="timer-bar-container">
            <div id="timerBar" class="timer-bar"></div>
        </div>

        <div id="sequenceBox" class="sequence-box">
            <!-- Os símbolos entram aqui dinamicamente -->
        </div>

        <button id="btnIniciar">INICIAR TESTE</button>
        <div id="mensagem">Pressione o botão para começar</div>
    </div>

    <script>
        // Mapeamento de direções para símbolos geométricos minimalistas universais
        const configDirecoes = {
            'ArrowUp':    { simbolo: '▲', nome: 'Cima' },
            'ArrowDown':  { simbolo: '■', nome: 'Baixo' },
            'ArrowLeft':  { simbolo: '◀', nome: 'Esquerda' },
            'ArrowRight': { simbolo: '▶', nome: 'Direita' }
        };

        const chavesDirecoes = Object.keys(configDirecoes);
        
        let sequenciaAtual = [];
        let indiceAtual = 0;
        let emJogo = false;
        let tempoLimite = 5000; // 5 segundos para completar
        let startTime, animationFrame;

        const sequenceBox = document.getElementById('sequenceBox');
        const timerBar = document.getElementById('timerBar');
        const btnIniciar = document.getElementById('btnIniciar');
        const mensagem = document.getElementById('mensagem');

        // Iniciar Teste
        btnIniciar.addEventListener('click', iniciarSkillCheck);

        function iniciarSkillCheck() {
            // Gera uma sequência aleatória de 5 símbolos
            sequenciaAtual = [];
            sequenceBox.innerHTML = '';
            indiceAtual = 0;
            emJogo = true;
            btnIniciar.style.display = 'none';
            mensagem.textContent = "Reproduza a sequência!";
            mensagem.style.color = "#94a3b8";

            for (let i = 0; i < 5; i++) {
                const randomKey = chavesDirecoes[Math.floor(Math.random() * chavesDirecoes.length)];
                sequenciaAtual.push(randomKey);

                const div = document.createElement('div');
                div.classList.add('symbol-item');
                div.textContent = configDirecoes[randomKey].simbolo;
                sequenceBox.appendChild(div);
            }

            // Destaca o primeiro elemento
            atualizarVisualizacao();

            // Animação da Barra de Tempo
            timerBar.style.transition = 'none';
            timerBar.style.transform = 'scaleX(1)';
            void timerBar.offsetWidth; // Força reflow
            timerBar.style.transition = `transform ${tempoLimite}ms linear`;
            timerBar.style.transform = 'scaleX(0)';

            startTime = Date.now();
            animationFrame = requestAnimationFrame(verificarTempo);
        }

        function verificarTempo() {
            if (!emJogo) return;
            const tempoDecorrido = Date.now() - startTime;

            if (tempoDecorrido >= tempoLimite) {
                finalizarJogo(false, "Tempo Esgotado!");
            } else {
                animationFrame = requestAnimationFrame(verificarTempo);
            }
        }

        // Ouvinte de Teclado
        window.addEventListener('keydown', (e) => {
            if (!emJogo) return;

            if (chavesDirecoes.includes(e.key)) {
                const itensUI = sequenceBox.children;

                if (e.key === sequenciaAtual[indiceAtual]) {
                    // Acertou o item atual
                    itensUI[indiceAtual].classList.remove('active');
                    itensUI[indiceAtual].classList.add('success');
                    
                    indiceAtual++;

                    if (indiceAtual < sequenciaAtual.length) {
                        atualizarVisualizacao();
                    } else {
                        finalizarJogo(true, "Sucesso! Perícia bem-sucedida.");
                    }
                } else {
                    // Errou a sequência
                    itensUI[indiceAtual].classList.add('error');
                    finalizarJogo(false, "Falhou! Sequência incorreta.");
                }
            }
        });

        function atualizarVisualizacao() {
            const itensUI = sequenceBox.children;
            for (let i = 0; i < itensUI.length; i++) {
                itensUI[i].classList.remove('active');
            }
            itensUI[indiceAtual].classList.add('active');
        }

        function finalizarJogo(sucesso, texto) {
            emJogo = false;
            cancelAnimationFrame(animationFrame);
            timerBar.style.transition = 'none';

            mensagem.textContent = texto;
            mensagem.style.color = sucesso ? "#22c55e" : "#ef4444";
            btnIniciar.style.display = 'inline-block';
            btnIniciar.textContent = "TENTAR NOVAMENTE";
        }
    </script>
</body>
</html>
